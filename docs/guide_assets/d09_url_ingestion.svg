oe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#2D3748" style="">fetched via the same safe</text><text x="130.0" y="366.35" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#2D3748" style="">path; unreadable → skip</text><circle cx="20" cy="300" r="13" fill="#C2601A"/><text x="20" y="305" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#FFFFFF" style="">6</text><path d="M950,195 L985,195 L985,282 L130,282 L130,298" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/><rect x="280" y="300" width="250" height="80" rx="10" fill="#E3F4F1" stroke="#1F7A70" stroke-width="1.8"/><text x="405.0" y="329.05" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#1A202C" style="">WebBaseLoader</text><text x="405.0" y="350.15" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#2D3748" style="">requests + BeautifulSoup</text><text x="405.0" y="366.35" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#2D3748" style="">raise_for_status=True</text><circle cx="280" cy="300" r="13" fill="#1F7A70"/><text x="280" y="305" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#FFFFFF" style="">7</text><path d="M240,340 L278,340" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/><rect x="570" y="300" width="400" height="80" rx="10" fill="#E3F4F1" stroke="#1F7A70" stroke-width="1.8"/><text x="770.0" y="337.15" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#1A202C" style="">get_text(): scripts/styles dropped,</text><text x="770.0" y="358.24999999999994" font-famil