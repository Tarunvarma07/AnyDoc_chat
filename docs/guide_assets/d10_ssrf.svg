<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="1000" height="470" fill="#FFFFFF"/><text x="240" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#B83232" style="">Without SSRF checks</text><text x="760" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#2F7D3A" style="">AnyDoc&#x27;s checks</text><rect x="30" y="50" width="420" height="60" rx="10" fill="#FDECEC" stroke="#B83232" stroke-width="1.8"/><text x="240.0" y="77.525" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="600" fill="#1A202C" style="">Attacker submits</text><text x="240.0" y="98.97500000000001" font-family="Consolas, 'Courier New', monospace" font-size="12" text-anchor="middle" font-weight="normal" fill="#2D3748" style="">http://169.254.169.254/latest/meta-data/</text><circle cx="30" cy="50" r="13" fill="#B83232"/><text x="30" y="55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#FFFFFF" style="">1</text><rect x="30" y="140" width="420" height="60" rx="10" fill="#EEF0F2" stroke="#5F6B76" stroke-width="1.8"/><text x="240.0" y="167.1875" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="600" fill="#1A202C" style="">Server fetches it from inside the cloud</text><text x="240.0" y="189.3125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#2D3748" style="">the attacker&#x27;s browser could never reach it</text><circle cx="30" cy="140" r="13" fill="#5F6B76"/><text x="30" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#FFFFFF" style="">2</text><rect x="30" y="230" width="420" height="60" rx="10" fill="#FDECEC" stroke="#B83232" stroke-width="1.8"/><text x="240.0" y="257.1875" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="600" fill="#1A202C" style="">Cloud metadata answers</text><text x="240.0" y="279.3125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#2D3748" style="">instance info, sometimes temporary credentials</text><circle cx="30" cy="230" r="13" fill="#B83232"/><text x="30" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#FFFFFF" style="">3</text><rect x="30" y="320" width="420" height="60" rx="10" fill="#FDECEC" stroke="#B83232" stroke-width="1.8"/><text x="240.0" y="347.1875" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="600" fill="#1A202C" style="">Response is indexed</text><text x="240.0" y="369.3125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#2D3748" style="">attacker asks the chatbot to read it back</text><circle cx="30" cy="320" r="13" fill="#B83232"/><text x="30" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#FFFFFF" style="">4</text><path d="M240,110 L240,138" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/><path d="M240,200 L240,228" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/><path d="M240,290 L240,318" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/><line x1="500" y1="40" x2="500" y2="400" stroke="#CBD5E0" stroke-width="2" stroke-dasharray="6 6"/><rect x="550" y="50" width="420" height="60" rx="10" fill="#FFF1E3" stroke="#C2601A" stroke-width="1.8"/><text x="760.0" y="77.1875" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="600" fill="#1A202C" style="">validate_url resolves the host</text><text x="760.0" y="99.3125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#2D3748" style="">getaddrinfo → every IPv4 and IPv6 address</text><circle cx="550" cy="50" r="13" fill="#C2601A"/><text x="550" y="55" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#FFFFFF" style="">1</text><rect x="550" y="140" width="420" height="60" rx="10" fill="#FFF1E3" stroke="#C2601A" stroke-width="1.8"/><text x="760.0" y="167.1875" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="600" fill="#1A202C" style="">169.254.169.254 is link-local</text><text x="760.0" y="189.3125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#2D3748" style="">is_global = False → rejected</text><circle cx="550" cy="140" r="13" fill="#C2601A"/><text x="550" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#FFFFFF" style="">2</text><rect x="550" y="230" width="420" height="60" rx="10" fill="#FDECEC" stroke="#B83232" stroke-width="1.8"/><text x="760.0" y="265.25" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#1A202C" style="">400 URL points to an internal/private IP</text><circle cx="550" cy="230" r="13" fill="#B83232"/><text x="550" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#FFFFFF" style="">3</text><rect x="550" y="320" width="420" height="60" rx="10" fill="#FFF1E3" stroke="#C2601A" stroke-width="1.8"/><text x="760.0" y="347.1875" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="600" fill="#1A202C" style="">Redirect trick also checked</text><text x="760.0" y="369.3125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#2D3748" style="">public site 302 → internal URL: hop rejected</text><circle cx="550" cy="320" r="13" fill="#C2601A"/><text x="550" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700" fill="#FFFFFF" style="">4</text><path d="M760,110 L760,138" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/><path d="M760,200 L760,228" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/><text x="500" y="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#B83232" style="">Still open: DNS rebinding — a hostile DNS server can answer “public” during the check and “internal”</text><text x="500" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle" font-weight="normal" fill="#B83232" style="">when requests connects a moment later. Fix (not implemented): pin the checked IP, or use an egress proxy.</text></svg>