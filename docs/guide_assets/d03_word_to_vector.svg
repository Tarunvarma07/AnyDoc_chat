t in AnyDoc: BM25 splits text with a regex (hybrid_search._tokenize);</text><text x="490" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="normal" fill="#4A5568" style="">the embedding model splits text into sub-word tokens internally. Chunk size is counted in characters, not tokens.</text></svg>