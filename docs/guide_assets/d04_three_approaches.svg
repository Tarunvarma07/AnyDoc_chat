<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/></marker></defs><rect width="980" height="360" fill="#FFFFFF"/><rect x="20" y="20" width="300" height="300" rx="10" fill="#FDECEC" stroke="#B83232" stroke-width="1.8"/><text x="170" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#B83232" style="">A. LLM alone</text><text x="170" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">Question → LLM</text><text x="170" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style=""></text><text x="170" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">LLM never saw your</text><text x="170" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">documents</text><text x="170" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">May guess or refuse</text><text x="170" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">No sources to check</text><rect x="340" y="20" width="300" height="300" rx="10" fill="#E6F4E7" stroke="#2F7D3A" stroke-width="1.8"/><text x="490" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#2F7D3A" style="">B. RAG (AnyDoc)</text><text x="490" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">Question → search your</text><text x="490" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">documents → best chunks</text><text x="490" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">→ LLM answers from them</text><text x="490" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style=""></text><text x="490" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">Cites [1]..[5]</text><text x="490" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">New file = re-index only</text><rect x="660" y="20" width="300" height="300" rx="10" fill="#EEF0F2" stroke="#5F6B76" stroke-width="1.8"/><text x="810" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="700" fill="#5F6B76" style="">C. Fine-tuning</text><text x="810" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">Train the model weights</text><text x="810" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">on your documents</text><text x="810" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style=""></text><text x="810" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">Slow + costly to update</text><text x="810" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">No built-in citations</text><text x="810" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">Can still hallucinate</text><text x="490" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#4A5568" style="font-style:italic;">AnyDoc uses B: documents change often and answers must point back to their source.</text></svg>