array="4 4"/><path d="M180.0,110 L494.0,110" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/><text x="340.0" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">1 type question + Enter</text><path d="M500.0,150 L186.0,150" fill="none" stroke="#4A5568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="340.0" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">2 show question + spinner</text><path d="M500.0,190 L814.0,190" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/><text x="660.0" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">3 requests.post(..., timeout=170) — blocks this script run</text><path d="M820.0,290 L506.0,290" fill="none" stroke="#4A5568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="660.0" y="284" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">4 JSON response (or error status)</text><path d="M500.0,320 L540.0,320 L540.0,338 L504.0,338" fill="none" stroke="#4A5568" stroke-width="2" marker-end="url(#ah)"/><text x="548.0" y="333" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#1A202C" style="">5 append to session_state.messages (max 40)</text><path d="M500.0,390 L186.0,390" fill="none" stroke="#4A5568" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="340.0" y="384" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1A202C" style="">6 render answer / refusal box, source expanders, retrieval trace</text><rect x="620" y="210" width="340" height="60" rx="6" fill="#FFFBEA" stroke="#A68A00" stroke-width="1.2"/><text x="630" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#5F4B00" style="">The UI waits synchronously: one request per</text><text x="630" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#5F4B00" style="">question; the spinner covers rewrite + retrieval + LLM.</text></svg>